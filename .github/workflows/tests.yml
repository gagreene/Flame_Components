name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags, required for hatch-vcs to derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install project (extras + dev group)
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=long
