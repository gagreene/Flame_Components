[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flame-components"
dynamic = ["version"]
description = "Fire behavior calculations for surface and crown fires"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Gregory A. Greene"},
]
dependencies = [
    "numpy>=1.20",
]
keywords = ["wildfire", "fire behavior", "flame", "pyrology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/flame_components"]

[tool.hatch.build.targets.sdist]
exclude = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
