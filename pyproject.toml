[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flame-components"
dynamic = ["version"]
description = "Compute flame characteristics (length, height, tilt, residence time, depth, and mid-flame wind speed) for surface and crown fires"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gregory A. Greene"},
]
dependencies = [
    "numpy>=1.23.2",
]
keywords = ["wildfire", "fire behavior", "flame", "pyrology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/gagreene/flame_components"
Source = "https://github.com/gagreene/flame_components"
"Issue Tracker" = "https://github.com/gagreene/flame_components/issues"
"Release Notes" = "https://github.com/gagreene/flame_components/releases"
Documentation = "https://github.com/gagreene/flame_components#readme"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/flame_components"]

[tool.hatch.build.targets.sdist]
exclude = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
